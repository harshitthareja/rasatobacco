<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500&family=Inter:wght@300;400&family=Montserrat:wght@600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      position: relative; width: 100%; height: 100%;
      background: oklch(0.16 0.005 60);
      overflow: hidden; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: oklch(0.94 0.005 80);
      display: flex; flex-direction: column;
    }
    .spec-tag {
      background: oklch(0.20 0.006 60); border-bottom: 1px solid oklch(0.78 0.09 48 / 0.2);
      padding: 9px 18px; font-size: 10px; letter-spacing: 0.08em; color: oklch(0.72 0.01 70);
      font-family: 'Montserrat', sans-serif;
    }
    .spec-tag b { color: #DEA193; }
    .scene { position: relative; flex: 1; }
    .puff { position: absolute; border-radius: 50%; filter: blur(20px); }
    .nav { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: 0.1em; }
    .icons { display: flex; gap: 16px; }
    .content {
      position: relative; z-index: 2; height: calc(100% - 64px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    }
    .flat-icon { opacity: 0.9; }
    .wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 56px; letter-spacing: 0.12em; }
    .diamond { width: 6px; height: 6px; background: #DEA193; transform: rotate(45deg); margin: 6px auto 0; }
    .tagline { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.34em; font-size: 12px; text-transform: uppercase; color: oklch(0.94 0.005 80 / 0.85); }
    .cta-row { position: absolute; bottom: 30px; left: 0; right: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .enter-rule { display: flex; align-items: center; gap: 14px; }
    .enter-rule .line { width: 28px; height: 1px; background: oklch(0.78 0.09 48 / 0.6); }
    .enter-label { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.26em; font-size: 10px; text-transform: uppercase; color: oklch(0.94 0.005 80 / 0.75); }
    .scroll-cue { font-size: 9px; letter-spacing: 0.28em; color: oklch(0.72 0.01 70); font-family: 'Montserrat', sans-serif; }
  </style>
</helmet>

<div class="stage">
  <div class="spec-tag"><b>FALLBACK STATE</b> — prefers-reduced-motion / low-power / mobile. Reuses existing 2D CinematicSmoke canvas, no WebGL loaded.</div>

  <div class="scene">
    <div class="puff" style="width:220px;height:220px;left:-40px;top:120px;background:oklch(0.78 0.09 48 / 0.10);"></div>
    <div class="puff" style="width:260px;height:260px;right:-60px;top:260px;background:oklch(0.78 0.09 48 / 0.08);"></div>
    <div class="puff" style="width:200px;height:200px;left:40px;top:60px;background:oklch(0.9 0.02 70 / 0.06);"></div>

    <div class="nav">
      <div class="logo">RASA</div>
      <div class="icons">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="oklch(0.94 0.005 80)" stroke-width="1.5"/><line x1="21" y1="21" x2="16.6" y2="16.6" stroke="oklch(0.94 0.005 80)" stroke-width="1.5"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6" stroke="oklch(0.94 0.005 80)" stroke-width="1.5"/><line x1="3" y1="12" x2="21" y2="12" stroke="oklch(0.94 0.005 80)" stroke-width="1.5"/><line x1="3" y1="18" x2="21" y2="18" stroke="oklch(0.94 0.005 80)" stroke-width="1.5"/></svg>
      </div>
    </div>

    <div class="content">
      <svg class="flat-icon" width="70" height="140" viewBox="0 0 70 140">
        <path d="M35,10 Q55,10 55,40 L48,40 L48,60 L60,60 L60,85 L44,85 L38,130 L32,130 L26,85 L10,85 L10,60 L22,60 L22,40 L15,40 Q15,10 35,10 Z"
              fill="none" stroke="oklch(0.86 0.07 52)" stroke-width="2"/>
      </svg>
      <div>
        <div class="wordmark">RASA</div>
        <div class="diamond"></div>
      </div>
      <div class="tagline">Smoke, Perfected</div>
    </div>

    <div class="cta-row">
      <div class="enter-rule">
        <div class="line"></div>
        <div class="enter-label">Enter the House</div>
        <div class="line"></div>
      </div>
      <div class="scroll-cue">SCROLL</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
