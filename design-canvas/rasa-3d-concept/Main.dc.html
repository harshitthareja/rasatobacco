<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500&family=Montserrat:wght@600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      position: relative;
      width: 100%; height: 100%;
      background: oklch(0.16 0.005 60);
      overflow: hidden;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: oklch(0.94 0.005 80);
    }
    .glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 46%, oklch(0.78 0.09 48 / 0.16), transparent 62%);
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, oklch(0.10 0.004 60) 96%);
      pointer-events: none;
    }
    .grain {
      position: absolute; inset: 0;
      opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    }
    .nav {
      position: absolute; top: 40px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 64px;
    }
    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      letter-spacing: 0.28em;
      font-size: 12px;
      color: #DEA193;
      text-transform: uppercase;
    }
    .hookah-wrap {
      position: absolute; left: 50%; top: 44%;
      transform: translate(-50%, -50%);
      width: 380px; height: 780px;
    }
    .content {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; text-align: center; pointer-events: none;
    }
    .wordmark {
      font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
      font-weight: 500;
      font-size: 118px;
      letter-spacing: 0.14em;
      color: oklch(0.95 0.01 75);
      text-shadow: 0 0 60px oklch(0.78 0.09 48 / 0.45), 0 4px 30px oklch(0 0 0 / 0.6);
      line-height: 1;
    }
    .diamond { width: 7px; height: 7px; background: #DEA193; transform: rotate(45deg); margin: 6px auto 0; opacity: 0.9; }
    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; letter-spacing: 0.4em; font-size: 15px;
      color: oklch(0.94 0.005 80 / 0.85); text-transform: uppercase;
      margin-top: 8px;
    }
    .cta-row {
      position: absolute; left: 0; right: 0; bottom: 56px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .enter-rule { display: flex; align-items: center; gap: 18px; }
    .enter-rule .line { width: 40px; height: 1px; background: oklch(0.78 0.09 48 / 0.6); }
    .enter-label {
      font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.3em;
      font-size: 11px; color: oklch(0.94 0.005 80 / 0.75); text-transform: uppercase;
    }
    .scroll-cue { font-size: 10px; letter-spacing: 0.3em; color: oklch(0.72 0.01 70); font-family: 'Montserrat', sans-serif; }
  </style>
</helmet>

<div class="stage">
  <div class="glow"></div>

  <svg class="grain" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="nav">
    <div class="eyebrow">RASA</div>
    <div class="eyebrow" style="letter-spacing:0.32em; opacity:0.7;">SMOKE, PERFECTED</div>
  </div>

  <div class="hookah-wrap">
    <svg viewBox="0 -110 320 750" width="100%" height="100%">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="oklch(0.40 0.05 48)"/>
          <stop offset="16%" stop-color="oklch(0.58 0.07 50)"/>
          <stop offset="36%" stop-color="oklch(0.92 0.05 65)"/>
          <stop offset="54%" stop-color="oklch(0.68 0.09 48)"/>
          <stop offset="80%" stop-color="oklch(0.44 0.06 46)"/>
          <stop offset="100%" stop-color="oklch(0.28 0.04 44)"/>
        </linearGradient>
        <radialGradient id="glassGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="oklch(0.30 0.02 60 / 0.55)"/>
          <stop offset="100%" stop-color="oklch(0.12 0.01 55 / 0.85)"/>
        </radialGradient>
        <radialGradient id="ember" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="oklch(0.86 0.16 60)"/>
          <stop offset="45%" stop-color="oklch(0.62 0.18 38)"/>
          <stop offset="100%" stop-color="oklch(0.30 0.10 30 / 0)"/>
        </radialGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
        <filter id="soft-lg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
      </defs>

      <ellipse cx="160" cy="300" rx="190" ry="270" fill="oklch(0.78 0.09 48 / 0.10)" filter="url(#soft-lg)"/>

      <ellipse cx="160" cy="560" rx="108" ry="66" fill="url(#glassGrad)" stroke="url(#metal)" stroke-width="2"/>
      <ellipse cx="160" cy="536" rx="70" ry="14" fill="oklch(1 0 0 / 0.05)"/>
      <ellipse cx="160" cy="497" rx="46" ry="10" fill="url(#metal)"/>

      <path d="M136,497 L124,430 Q120,410 140,405 L180,405 Q200,410 196,430 L184,497 Z" fill="url(#metal)"/>
      <ellipse cx="160" cy="405" rx="42" ry="30" fill="url(#metal)"/>
      <rect x="145" y="330" width="30" height="78" rx="6" fill="url(#metal)"/>
      <ellipse cx="160" cy="330" rx="56" ry="36" fill="url(#metal)"/>
      <rect x="150" y="250" width="20" height="86" rx="4" fill="url(#metal)"/>
      <ellipse cx="160" cy="246" rx="92" ry="13" fill="url(#metal)"/>
      <ellipse cx="160" cy="243" rx="92" ry="13" fill="oklch(1 0 0 / 0.06)"/>
      <rect x="152" y="200" width="16" height="48" fill="url(#metal)"/>
      <path d="M120,200 Q120,150 160,140 Q200,150 200,200 Z" fill="url(#metal)"/>
      <ellipse cx="160" cy="200" rx="42" ry="10" fill="oklch(0.20 0.02 48)"/>
      <circle cx="160" cy="165" r="26" fill="url(#ember)" opacity="0.9"/>

      <path d="M180,360 C 260,380 300,340 322,296" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="322" cy="296" r="10" fill="url(#metal)"/>

      <g opacity="0.55">
        <ellipse cx="152" cy="100" rx="44" ry="28" fill="oklch(0.90 0.02 70 / 0.5)" filter="url(#soft)"/>
        <ellipse cx="196" cy="55" rx="58" ry="32" fill="oklch(0.90 0.02 70 / 0.35)" filter="url(#soft)"/>
        <ellipse cx="146" cy="8" rx="66" ry="34" fill="oklch(0.90 0.02 70 / 0.22)" filter="url(#soft)"/>
        <ellipse cx="188" cy="-42" rx="70" ry="34" fill="oklch(0.90 0.02 70 / 0.12)" filter="url(#soft)"/>
      </g>
    </svg>
  </div>

  <div class="content">
    <div>
      <div class="wordmark">RASA</div>
      <div class="diamond"></div>
    </div>
    <div class="tagline">Smoke, Perfected</div>
  </div>

  <div class="cta-row">
    <div class="enter-rule">
      <div class="line"></div>
      <div class="enter-label">Enter the House</div>
      <div class="line"></div>
    </div>
    <div class="scroll-cue">SCROLL</div>
  </div>

  <div class="vignette"></div>
</div>
</x-dc>
</body>
</html>
