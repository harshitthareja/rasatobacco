<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500&family=Montserrat:wght@600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .stage {
      position: relative; width: 100%; height: 100%;
      background: linear-gradient(160deg, #742131 0%, #5B1823 42%, oklch(0.10 0.004 60) 100%);
      overflow: hidden; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      color: oklch(0.94 0.005 80);
    }
    .pattern { position: absolute; inset: 0; opacity: 0.10; }
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, transparent 30%, oklch(0.10 0.004 60 / 0.75) 96%); pointer-events: none; }
    .layout { position: absolute; inset: 0; display: flex; align-items: center; }
    .text-col { width: 46%; padding: 0 0 0 72px; display: flex; flex-direction: column; gap: 22px; }
    .eyebrow { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.28em; font-size: 12px; color: #DEA193; text-transform: uppercase; }
    h1 { font-family: 'Cormorant Garamond', ui-serif, Georgia, serif; font-weight: 500; font-size: 88px; line-height: 0.95; }
    .expr { font-family: 'Cormorant Garamond', ui-serif, Georgia, serif; font-style: italic; font-size: 26px; color: oklch(0.86 0.07 52); }
    .tag { font-size: 17px; font-weight: 300; color: oklch(0.94 0.005 80 / 0.82); max-width: 360px; line-height: 1.5; }
    .rule { width: 56px; height: 1px; background: linear-gradient(90deg, transparent, oklch(0.78 0.09 48), transparent); }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; width: fit-content;
      padding: 15px 30px; border: 1px solid oklch(0.86 0.07 52 / 0.6);
      font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.24em; text-transform: uppercase; color: oklch(0.94 0.005 80);
      margin-top: 6px;
    }
    .art-col { width: 54%; height: 100%; position: relative; }
    .hookah-wrap { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 320px; height: 660px; }
    .tab { position: absolute; top: 40px; right: 64px; text-align: right; }
  </style>
</helmet>

<div class="stage">
  <svg class="pattern" width="100%" height="100%">
    <defs>
      <pattern id="lattice" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
        <path d="M45,4 L84,45 L45,86 L6,45 Z" fill="none" stroke="#D3A188" stroke-width="1"/>
        <circle cx="45" cy="45" r="4" fill="none" stroke="#D3A188" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#lattice)"/>
  </svg>

  <div class="tab eyebrow">COLLECTION I · 01 OF 03</div>

  <div class="layout">
    <div class="text-col">
      <div class="eyebrow">Heritage</div>
      <h1>Majlis</h1>
      <div class="expr">The Expression of Heritage</div>
      <div class="rule"></div>
      <div class="tag">Where evenings remember themselves. Rooted in heritage, warmed by hospitality — the timeless character of an evening spent in good company.</div>
      <div class="btn">Enter Majlis →</div>
    </div>

    <div class="art-col">
      <div class="hookah-wrap">
        <svg viewBox="0 -110 320 750" width="100%" height="100%">
          <defs>
            <linearGradient id="metalM" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="oklch(0.40 0.05 48)"/>
              <stop offset="16%" stop-color="oklch(0.58 0.07 50)"/>
              <stop offset="36%" stop-color="oklch(0.92 0.05 65)"/>
              <stop offset="54%" stop-color="oklch(0.68 0.09 48)"/>
              <stop offset="80%" stop-color="oklch(0.44 0.06 46)"/>
              <stop offset="100%" stop-color="oklch(0.28 0.04 44)"/>
            </linearGradient>
            <radialGradient id="glassM" cx="50%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#742131" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="oklch(0.12 0.01 55 / 0.85)"/>
            </radialGradient>
            <radialGradient id="emberM" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="oklch(0.86 0.16 60)"/>
              <stop offset="45%" stop-color="oklch(0.62 0.18 38)"/>
              <stop offset="100%" stop-color="oklch(0.30 0.10 30 / 0)"/>
            </radialGradient>
            <filter id="softM" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
            <filter id="softM2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
          </defs>

          <ellipse cx="160" cy="300" rx="190" ry="270" fill="#D3A188" opacity="0.12" filter="url(#softM2)"/>

          <ellipse cx="160" cy="560" rx="108" ry="66" fill="url(#glassM)" stroke="url(#metalM)" stroke-width="2"/>
          <ellipse cx="160" cy="536" rx="70" ry="14" fill="oklch(1 0 0 / 0.05)"/>
          <ellipse cx="160" cy="497" rx="46" ry="10" fill="url(#metalM)"/>

          <path d="M136,497 L124,430 Q120,410 140,405 L180,405 Q200,410 196,430 L184,497 Z" fill="url(#metalM)"/>
          <ellipse cx="160" cy="405" rx="42" ry="30" fill="url(#metalM)"/>
          <rect x="145" y="330" width="30" height="78" rx="6" fill="url(#metalM)"/>
          <ellipse cx="160" cy="330" rx="56" ry="36" fill="url(#metalM)"/>
          <rect x="150" y="250" width="20" height="86" rx="4" fill="url(#metalM)"/>
          <ellipse cx="160" cy="246" rx="92" ry="13" fill="url(#metalM)"/>
          <ellipse cx="160" cy="243" rx="92" ry="13" fill="oklch(1 0 0 / 0.06)"/>
          <rect x="152" y="200" width="16" height="48" fill="url(#metalM)"/>
          <path d="M120,200 Q120,150 160,140 Q200,150 200,200 Z" fill="url(#metalM)"/>
          <ellipse cx="160" cy="200" rx="42" ry="10" fill="oklch(0.20 0.02 48)"/>
          <circle cx="160" cy="165" r="26" fill="url(#emberM)" opacity="0.9"/>

          <path d="M180,360 C 260,380 300,340 322,296" fill="none" stroke="url(#metalM)" stroke-width="10" stroke-linecap="round"/>
          <circle cx="322" cy="296" r="10" fill="url(#metalM)"/>

          <g opacity="0.5">
            <ellipse cx="152" cy="100" rx="44" ry="28" fill="oklch(0.90 0.02 70 / 0.5)" filter="url(#softM)"/>
            <ellipse cx="196" cy="55" rx="58" ry="32" fill="oklch(0.90 0.02 70 / 0.32)" filter="url(#softM)"/>
            <ellipse cx="146" cy="8" rx="66" ry="34" fill="oklch(0.90 0.02 70 / 0.20)" filter="url(#softM)"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="vignette"></div>
</div>
</x-dc>
</body>
</html>
