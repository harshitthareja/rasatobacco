name: Supabase database setup

# Brings the website's Supabase database up to date (idempotent), prints a
# health check, and keeps the auth redirect allow-list covering the site. Uses the Supabase Management
# API with the SUPABASE_ACCESS_TOKEN repository secret.
#   mode=check  → read-only report
#   mode=setup  → apply supabase/setup/ensure_schema.sql, then report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only) or setup (apply schema, then check)"
        required: true
        default: setup
        type: choice
        options: [setup, check]
      site_url:
        description: "Optional: set the auth Site URL (default redirect after sign-in)"
        required: false
        default: ""

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qhzbxlyyksppynxnnmqe
    steps:
      - uses: actions/checkout@v4

      - name: Define query helper
        run: |
          cat > /tmp/q.sh <<'SH'
          #!/usr/bin/env bash
          # Usage: q.sh <file.sql> — runs SQL via the Management API, prints the JSON result.
          set -euo pipefail
          body=$(jq -Rs '{query: .}' < "$1")
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          jq . /tmp/out.json 2>/dev/null || cat /tmp/out.json
          [ "$code" -lt 300 ]
          SH
          chmod +x /tmp/q.sh

      - name: Health check (before)
        continue-on-error: true
        run: /tmp/q.sh supabase/setup/health_check.sql

      - name: Apply schema
        if: inputs.mode == 'setup'
        run: /tmp/q.sh supabase/setup/ensure_schema.sql

      - name: Health check (after)
        if: inputs.mode == 'setup'
        run: /tmp/q.sh supabase/setup/health_check.sql

      - name: Auth redirect settings
        run: |
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          curl -sS "${auth[@]}" "$api" | jq '{site_url, uri_allow_list, external_google_enabled}'
          if [ "${{ inputs.mode }}" = "setup" ]; then
            current=$(curl -sS "${auth[@]}" "$api" | jq -r '.uri_allow_list // ""')
            wanted="https://rasatobacco.com/**,https://admin.rasatobacco.com/**,https://rasatobacco.vercel.app/**,https://*-harshit-tharejas-projects.vercel.app/**,http://localhost:8080/**,http://localhost:5174/**"
            list=$(printf '%s,%s' "$current" "$wanted" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)
            echo "Updating redirect allow-list (Site URL left as is unless given)…"
            jq -n --arg list "$list" --arg site "${{ inputs.site_url }}" \
              '{uri_allow_list: $list} + (if $site != "" then {site_url: $site} else {} end)' \
              | curl -sS -X PATCH "${auth[@]}" -H "Content-Type: application/json" -d @- "$api" \
              | jq '{site_url, uri_allow_list}'
          fi
