name: Deploy Supabase functions

# Deploys every edge function in supabase/functions (create-order,
# verify-payment, razorpay-webhook, order-tracking, admin-*, …) to the
# Supabase project the website uses. Needs one repository secret:
#   SUPABASE_ACCESS_TOKEN — supabase.com → Account → Access Tokens
# Function secrets (Razorpay, Flexi) are set in the Supabase dashboard,
# never in this repository.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qhzbxlyyksppynxnnmqe
    steps:
      - uses: actions/checkout@v4
      - name: Check for access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
